version: "3.8"

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wrap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wrap-network

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wrap-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - NEXT_PUBLIC_API_URL=http://api:3001
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wrap-network

  # Express API Server
  api:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: wrap-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - X402_FACILITATOR_URL=${X402_FACILITATOR_URL:-https://x402.agentstrail.ai}
      - PLATFORM_FEE_RATE=${PLATFORM_FEE_RATE:-0.1}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wrap-network

volumes:
  redis_data:

networks:
  wrap-network:
    driver: bridge
