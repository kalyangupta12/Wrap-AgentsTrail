# Nixpacks configuration for Web App

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "openssl"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = [
  "cd packages/db && npx prisma generate && cd ../..",
  "pnpm --filter @wrap/config build",
  "pnpm --filter @wrap/db build",
  "pnpm --filter @wrap/web build"
]

[start]
cmd = "cd apps/web && node .next/standalone/apps/web/server.js"

[variables]
NODE_ENV = "production"
PORT = "3000"
HOSTNAME = "0.0.0.0"
